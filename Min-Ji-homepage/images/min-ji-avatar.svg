<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="title description">
  <title id="title">Min Ji monogram</title>
  <desc id="description">A navy and teal circular monogram with the initials M J.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15324a"/>
      <stop offset="1" stop-color="#0b7f86"/>
    </linearGradient>
  </defs>
  <circle cx="200" cy="200" r="196" fill="url(#background)"/>
  <circle cx="200" cy="200" r="172" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
  <text x="200" y="234" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="132" text-anchor="middle" letter-spacing="8">MJ</text>
</svg>
